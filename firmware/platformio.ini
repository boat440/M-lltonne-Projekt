; PlatformIO-Projektkonfiguration
; Öffne den Ordner "firmware" in VS Code mit installierter PlatformIO-Extension.

[env:esp32dev]
platform = espressif32
board = esp32dev          ; ggf. anpassen an dein konkretes Board (z.B. esp32doit-devkit-v1)
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
